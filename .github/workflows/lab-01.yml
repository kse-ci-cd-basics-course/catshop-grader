# Reusable workflow — grade all of lab 1 in one call.
#
#   jobs:
#     lab-01:
#       uses: kse-ci-cd-basics-course/catshop-grader/.github/workflows/lab-01.yml@v1
#       with:
#         required: "dockerfile,hardening,compose"
#         bonus: "wiremock,networks"
#
# Each section still becomes its own named check: the matrix fans out into one job
# per section. There is one of these per lab, because `uses:` cannot take an
# expression — a lab-agnostic workflow could not choose its action path.
name: lab-01

on:
  workflow_call:
    inputs:
      path:
        description: "The lab folder to grade"
        required: false
        type: string
        default: "lab-01"
      required:
        description: "Comma-separated sections that must pass"
        required: false
        type: string
        default: "dockerfile,hardening,compose"
      bonus:
        description: "Comma-separated sections that may fail without failing the lab"
        required: false
        type: string
        default: "wiremock,networks"
      port:
        description: "Host port the app is expected on"
        required: false
        type: string
        default: "8080"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.split.outputs.required }}
      bonus: ${{ steps.split.outputs.bonus }}
      has_bonus: ${{ steps.split.outputs.has_bonus }}
    steps:
      - id: split
        shell: bash
        env:
          REQUIRED: ${{ inputs.required }}
          BONUS: ${{ inputs.bonus }}
        run: |
          # a comma-separated input becomes the JSON array a matrix can consume
          to_json() {
            printf '%s' "$1" | tr ',' '\n' \
              | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))'
          }
          req="$(to_json "$REQUIRED")"
          bon="$(to_json "$BONUS")"
          echo "required=$req" >> "$GITHUB_OUTPUT"
          echo "bonus=$bon"    >> "$GITHUB_OUTPUT"
          if [ "$bon" = '[]' ]; then echo "has_bonus=false" >> "$GITHUB_OUTPUT"
          else                       echo "has_bonus=true"  >> "$GITHUB_OUTPUT"; fi

  required:
    needs: plan
    name: "section · ${{ matrix.section }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one broken section must not hide the others
      matrix:
        section: ${{ fromJSON(needs.plan.outputs.required) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: kse-ci-cd-basics-course/catshop-grader/lab-01@v1
        with:
          section: ${{ matrix.section }}
          path: ${{ inputs.path }}
          port: ${{ inputs.port }}

  bonus:
    needs: plan
    if: needs.plan.outputs.has_bonus == 'true'
    name: "section · ${{ matrix.section }} (bonus)"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        section: ${{ fromJSON(needs.plan.outputs.bonus) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: kse-ci-cd-basics-course/catshop-grader/lab-01@v1
        with:
          section: ${{ matrix.section }}
          path: ${{ inputs.path }}
          port: ${{ inputs.port }}
