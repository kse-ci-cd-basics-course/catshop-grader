name: "Catshop lab 2 · verify"
description: "Grade one section of lab 2 (test, build, publish) and report it as a named check."
author: "KSE · CI/CD and Cloud Deployment"

inputs:
  section:
    description: >-
      Which section to grade: tests | pipeline | published-image | cache.
    required: true
  path:
    description: >-
      The lab folder to grade, relative to the repository root (e.g. lab-02).
    required: false
    default: "lab-02"
  port:
    description: >-
      The host port the published image is expected to serve on.
    required: false
    default: "8080"
  token:
    description: >-
      A token with `actions: read` — the cache section asks the repository which
      caches exist.
    required: false
    default: ${{ github.token }}

  bonus:
    description: >-
      true for a bonus section: it still reports every check, but it cannot
      fail the job, because a bonus can only add marks.
    required: false
    default: "false"

outputs:
  pass:
    description: "Number of checks that passed."
    value: ${{ steps.verify.outputs.pass }}
  fail:
    description: "Number of checks that failed. Zero means the section is clean."
    value: ${{ steps.verify.outputs.fail }}
  warn:
    description: "Number of judgement calls to explain in the pull request."
    value: ${{ steps.verify.outputs.warn }}
  score:
    description: "Passed checks as a percentage of decided checks."
    value: ${{ steps.verify.outputs.score }}

runs:
  using: composite
  steps:
    # The grader pins its own Python. `ubuntu-latest` moved to 26.04, whose system
    # Python is 3.14, and the lab's psycopg[binary]==3.2.3 has no wheel for it — so
    # the suite never ran and the student was told their dependencies do not install.
    # Reported by Viktoriia Semenko, 2026-11-15.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # setup-python's interpreter has no PyYAML. Reported 2026-11-18.
    - name: "The grader's own dependencies"
      shell: bash
      run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

    - name: "Grade section ${{ inputs.section }}"
      id: verify
      shell: bash
      env:
        PORT: ${{ inputs.port }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # published-image checks the revision label against git history
        git -C "$GITHUB_WORKSPACE" fetch --unshallow --quiet 2>/dev/null || true
        bash "${{ github.action_path }}/verify.sh" \
          --section "${{ inputs.section }}" \
          --path "${{ inputs.path }}" \
          ${{ inputs.bonus == 'true' && '--bonus' || '' }}
